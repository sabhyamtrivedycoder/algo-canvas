<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoCanvas — Algorithm Visualizer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="logo"><span>⚡</span><h1>AlgoCanvas</h1><span class="badge">v1.0</span></div>
    <div class="controls">
      <select id="algoSelect">
        <option value="astar">A* Search (Heuristic Manhattan)</option>
        <option value="dijkstra">Dijkstra's Algorithm (Weighted)</option>
        <option value="bfs">Breadth-First Search (Unweighted)</option>
        <option value="bubblesort">Bubble Sort (Comparison)</option>
      </select>
      <button id="runBtn" class="btn primary">▶ Visualize</button>
      <button id="clearBtn" class="btn secondary">↺ Reset</button>
      <button id="mazeBtn" class="btn secondary">🎲 Random Maze</button>
      <div class="speed-box"><label>Speed:</label><input type="range" id="speedRange" min="5" max="100" value="40"></div>
    </div>
  </header>
  <main class="main">
    <div class="metrics">
      <div>Algorithm: <span id="algoLabel">A* Search</span></div>
      <div>Nodes Visited: <span id="nodesVisited">0</span></div>
      <div>Path Length: <span id="pathLength">0</span></div>
      <div>Execution Time: <span id="execTime">0 ms</span></div>
    </div>
    <div id="gridContainer" class="grid"></div>
    <div id="sortContainer" class="sort-grid" style="display:none;"></div>
  </main>
  <footer><p>Engineered by <a href="https://sabhyamtrivedycoder.github.io/portfolio/">Sabhyam Trivedy</a> • 100% Client-Side Pure JavaScript & Canvas</p></footer>
  <script src="app.js"></script>
</body>
</html>
